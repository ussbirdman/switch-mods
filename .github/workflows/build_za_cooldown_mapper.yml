name: Build ZA Cooldown Mapper

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ZA Debug Tools
    runs-on: ubuntu-latest

    steps:
      - name: Checkout clean upstream source
        uses: actions/checkout@v4.2.2
        with:
          repository: Martmists-GH/switch-mods
          ref: 831e232c19d425816c24c2d2e5d5a79edfb38e6c
          path: source
          submodules: recursive
          fetch-depth: 1

      - name: Checkout mapper files from this branch
        uses: actions/checkout@v4.2.2
        with:
          path: overlay
          submodules: false

      - name: Apply mapper files to clean source
        shell: bash
        run: |
          set -euo pipefail

          install -D -m 0644 \
            overlay/src/pokemon_za/common/sym/game/debug_tools/cooldown_mapper.sym \
            source/src/pokemon_za/common/sym/game/debug_tools/cooldown_mapper.sym

          install -D -m 0644 \
            overlay/src/pokemon_za/mod_debug_tools/src/battle_hooks.cpp \
            source/src/pokemon_za/mod_debug_tools/src/battle_hooks.cpp

          install -D -m 0644 \
            overlay/src/pokemon_za/mod_debug_tools/src/hook_util.h \
            source/src/pokemon_za/mod_debug_tools/src/hook_util.h

          install -D -m 0644 \
            overlay/src/pokemon_za/mod_debug_tools/src/ui.cpp \
            source/src/pokemon_za/mod_debug_tools/src/ui.cpp

          test -f source/src/pokemon_za/common/sym/game/debug_tools/cooldown_mapper.sym
          test -f source/src/pokemon_za/mod_debug_tools/src/battle_hooks.cpp
          test -f source/src/pokemon_za/mod_debug_tools/src/hook_util.h
          test -f source/src/pokemon_za/mod_debug_tools/src/ui.cpp

      - name: Install system packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            liblz4-dev \
            cmake \
            ninja-build \
            autoconf \
            automake \
            libtool \
            pkg-config

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache built Switch STL
        uses: actions/cache@v4
        with:
          path: source/lib/std
          key: switch-std-${{ runner.os }}-clang20-v3

      - name: Cache Python environment
        uses: actions/cache@v4
        with:
          path: source/.python_env
          key: switch-python-env-${{ runner.os }}-py312-v3

      - name: Set up switch-tools
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/switchbrew/switch-tools \
            "$GITHUB_WORKSPACE/switch-tools"
          cd "$GITHUB_WORKSPACE/switch-tools"
          ./autogen.sh
          ./configure
          make -j "$(nproc)"

      - name: Set up Clang 20
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y \
            clang-20 \
            llvm-20 \
            lld-20 \
            libclang-20-dev \
            llvm-20-dev

          LLVM_BIN="/usr/lib/llvm-20/bin"
          test -x "$LLVM_BIN/clang"
          test -x "$LLVM_BIN/clang++"
          test -x "$LLVM_BIN/ld.lld"
          echo "$LLVM_BIN" >> "$GITHUB_PATH"

      - name: Build Sail with the repository helper
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-20/bin:$PATH"
          export CC="/usr/lib/llvm-20/bin/clang"
          export CXX="/usr/lib/llvm-20/bin/clang++"

          cd "$GITHUB_WORKSPACE/source"

          echo "Pinned source commit:"
          git rev-parse HEAD

          echo "Submodule revisions:"
          git submodule status --recursive

          test -f tools/setup_sail.py

          echo "Sail source files found:"
          find lib/hakkun -maxdepth 5 \
            \( -name CMakeLists.txt -o -name '*.cpp' -o -name '*.h' \) \
            -path '*sail*' -print | head -100

          rm -rf sail tools/sail
          python3.12 tools/setup_sail.py

          test -x tools/sail
          ls -l tools/sail

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-20/bin:$PATH"
          export SWITCHTOOLS="$GITHUB_WORKSPACE/switch-tools"

          cd "$GITHUB_WORKSPACE/source"
          test -x tools/sail

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain.cmake \
            -DCMAKE_C_COMPILER=/usr/lib/llvm-20/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/lib/llvm-20/bin/clang++ \
            -DCMAKE_ASM_COMPILER=/usr/lib/llvm-20/bin/clang

      - name: Build ZA Debug Tools package
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-20/bin:$PATH"
          export SWITCHTOOLS="$GITHUB_WORKSPACE/switch-tools"

          cd "$GITHUB_WORKSPACE/source"
          test -x tools/sail
          cmake --build build --target ZA_Debug_Tools_zip_modmanager -j 4

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZA-Debug-Tools-Cooldown-Mapper-v1
          path: source/build/zips/*.zip
          if-no-files-found: error
